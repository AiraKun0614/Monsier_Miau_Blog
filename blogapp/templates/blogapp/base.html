<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog and Reviews</title> 
  <script src="https://cdn.tailwindcss.com"></script>
  {% load static %}
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {}
      },
      plugins: []
    };
  </script>
  
  <style>
    @font-face {
      font-family: 'Playful';
      src: url('{% static "fonts/playful.woff2" %}') format('woff2');
    }
    .font-playful {
      font-family: 'Playful', sans-serif;
    }
    .bg-cat-blue { background-color: #1e90ff; }
    .bg-cat-purple { background-color: #e6e6fa; }
    .bg-soft-purple { background-color: #4b0082; }
    .text-cat-blue { color: #1e90ff; }
    .text-cat-pink { color: #ff69b4; }
    .border-cat-pink { border-color: #ff69b4; }
    .focus\:ring-cat-blue:focus { --tw-ring-color: #1e90ff; }
    .focus\:border-cat-blue:focus { border-color: #1e90ff; }
    .hover\:bg-blue-400:hover { background-color: #63b3ed; }
    .hover\:bg-green-600:hover { background-color: #34d399; }
    .hover\:bg-purple-600:hover { background-color: #9333ea; }
    body {
      background-image: url('{% static "images/cat-pattern.png" %}');
      background-size: 150px;
      background-repeat: repeat;
      background-attachment: fixed;
      background-color: #f9f9f9;
    }
    .bg-overlay {
      background: rgba(255, 255, 255, 0.9);
    }
    .dark .bg-overlay {
      background: rgba(0, 0, 0, 0.8);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-bounce {
      animation: bounce 1s ease infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 4s linear infinite;
    }
  </style>
</head>
<body id="body" class="flex flex-col min-h-screen bg-white dark:bg-black text-gray-900 dark:text-gray-200 font-playful">
  <!--ENCABEZADO -->
  <nav class="bg-white dark:bg-gradient-to-r dark:from-gray-900 dark:to-gray-700 shadow-md py-4 px-6 transition-colors">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="{% url 'blogapp:blog_list' %}" class="text-3xl md:text-4xl font-bold text-white flex items-center animate-bounce">
        Monsier Miau 🐾</a>
      <a class="ml-2 text-lg hidden md:block">El Diario Del Gato Ilustre</a>
      <!--NAVEGACION -->   
      <div class="flex items-center space-x-2 md:space-x-4">
        <button onclick="toggleDarkMode()" class="px-3 py-2 md:px-4 md:py-2 bg-cat-purple dark:bg-gray-800 text-white rounded-lg hover:bg-blue-400 dark:hover:bg-blue-500 transition-all duration-300 flex items-center text-sm md:text-base">🌞</span>
          <span id="theme-label" class="transition-opacity duration-500 ease-in-out">Modo Claro</span>
        </button>
        </button>
        {% if user.is_authenticated %}
          <a href="{% url 'blogapp:add_blog' %}" class="px-3 py-2 md:px-4 md:py-2 bg-cat-blue text-white rounded-lg hover:bg-blue-400 transition-all duration-300 text-sm md:text-base">New Blog</a>
          <a href="{% url 'blogapp:logout' %}" class="bg-cat-pink hover:bg-cat-pink text-white dark:bg-red-600 dark:hover:bg-red-700 dark:text-white font-medium py-2 px-4 rounded transition-all duration-500 ease-in-out">Log Out</a>
        {% else %}
          <a href="{% url 'blogapp:login' %}" class="px-3 py-2 md:px-4 md:py-2 bg-cat-blue text-white rounded-lg hover:bg-blue-400 transition-all duration-300 text-sm md:text-base">Log In</a>
          <a href="{% url 'blogapp:register' %}" class="bg-green-500 hover:bg-green-600 text-white dark:bg-green-600 dark:hover:bg-green-700 dark:text-white font-medium py-2 px-4 rounded transition-all duration-500 ease-in-out">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <!---->
  <main class="flex-grow w-full bg-white dark:bg-gray-900 transition-all duration-700 ease-in-out">
    <div class="max-w-4xl mx-auto px-4 py-8">
      {% if messages %}
          <div class="mb-6">
              {% for message in messages %}
                  <div class="p-4 rounded-lg bg-{{ message.tags }}-100 dark:bg-{{ message.tags }}-800 text-{{ message.tags }}-700 dark:text-{{ message.tags }}-200 shadow-md transition-all duration-300 animate-fade-in">
                      {{ message }}
                  </div>
              {% endfor %}
          </div>
      {% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    // Persist dark mode setting
    document.addEventListener('DOMContentLoaded', () => {
      const prefersDark = localStorage.getItem('theme') === 'dark';
      const body = document.getElementById('body');
      const icon = document.getElementById('theme-icon');
      if (prefersDark) {
        body.classList.add('dark');
        if (icon) icon.textContent = '🌙';
        const label = document.getElementById('theme-label');
        if (label) label.textContent = 'Modo Oscuro';
      } else {
        if (icon) icon.textContent = '🌞';
        const label = document.getElementById('theme-label');
        if (label) label.textContent = 'Modo Claro';
      }
    });

    function toggleDarkMode() {
      const body = document.getElementById('body');
      const icon = document.getElementById('theme-icon');
      const isDark = body.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (icon) {
        icon.classList.add('rotate-180');
        setTimeout(() => {
          icon.textContent = isDark ? '🌙' : '🌞';
          const label = document.getElementById('theme-label');
          if (label) label.style.opacity = 0;
          setTimeout(() => {
            label.textContent = isDark ? 'Modo Oscuro' : 'Modo Claro';
            label.style.opacity = 1;
          }, 250);
          icon.classList.remove('rotate-180');
        }, 250);
      }
    }
  </script>

</body>
</html>
