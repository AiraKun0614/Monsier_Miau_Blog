{% extends 'base.html' %} <!-- ACTUALIZADO PARA EL CKEditor -->
{% block content %}
  <section class="bg-white dark:bg-gray-900 p-6 rounded-lg shadow-lg max-w-2xl mx-auto mt-8 transition-all duration-700 ease-in-out animate-fade-in">
    <h2 class="text-2xl font-semibold mb-4 dark:text-white text-gray-900">Create a New Blog</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.media }}

      <div class="space-y-4">
        {% for field in form %}
          <div>
            <label class="block text-sm font-medium text-white mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <p class="text-red-500 text-sm">{{ field.errors }}</p>
            {% endif %}
          </div>
        {% endfor %}
      </div>

      <button type="submit"
              class="mt-4 px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded">
        Publicar Blog
      </button>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          const categorySelect = document.querySelector('[name="category"]');
          const subcategorySelect = document.querySelector('[name="subcategory"]');

          categorySelect.addEventListener("change", function () {
            const categoryId = this.value;

            fetch(`/blog/ajax/load-subcategories/?category=${categoryId}`)
              .then(response => response.json())
              .then(data => {
                // Limpiar opciones actuales
                subcategorySelect.innerHTML = '<option value="">---------</option>';
                
                // Agregar nuevas subcategorías
                data.forEach(subcategory => {
                  const option = document.createElement('option');
                  option.value = subcategory.id;
                  option.textContent = subcategory.name;
                  subcategorySelect.appendChild(option);
                });
              });
          });
        });
      </script>


</form>

  </section>
{% endblock %}
