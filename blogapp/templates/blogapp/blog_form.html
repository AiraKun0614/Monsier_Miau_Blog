{% extends 'base.html' %}
{% block content %}
  <section class="bg-cat-purple dark:bg-soft-purple p-8 rounded-xl shadow-lg max-w-2xl mx-auto mt-8 transition-all duration-700 ease-in-out animate-fade-in">
    <h2 class="text-2xl font-playful mb-6 text-gray-900 dark:text-gray-200">Create a New Blog 🐾</h2>
    <form method="post" class="space-y-6">
      {% csrf_token %}
      {{ form.media }}
      <div>
        <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Title</label>
        {{ form.title }}
      </div>
      <div>
        <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Content</label>
        {{ form.content }}
      </div>
      <button type="submit" class="bg-cat-blue hover:bg-blue-400 text-white dark:bg-blue-600 dark:hover:bg-blue-500 px-4 py-2 rounded-lg shadow-md transition-colors duration-300 w-full font-playful">Save 🐱</button>
    </form>
  </section>
{% endblock %}
