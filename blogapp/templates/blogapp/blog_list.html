{% extends 'base.html' %}
{% block content %}
  <h1 class="text-3xl font-playful mb-6 text-center text-gray-900 dark:text-gray-200">All Blogs 🐾</h1>
  <div class="grid gap-8 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto px-4">
    {% for blog in object_list %}
      <div class="bg-cat-purple dark:bg-soft-purple rounded-xl shadow-md p-6 hover:shadow-2xl transition-all duration-700 ease-in-out dark:text-gray-200 text-gray-900 animate-fade-in">
        <h2 class="text-xl font-semibold mb-2">
          <a href="{% url 'blogapp:blog_detail' blog.pk %}" class="text-cat-blue hover:text-blue-300 dark:text-cat-blue dark:hover:text-blue-400 transition-colors duration-300">{{ blog.title }}</a>
        </h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">by {{ blog.author.username }} - {{ blog.created_at }}</p>
        <div class="flex justify-end text-cat-pink dark:text-pink-400 text-sm">🐾 Meow!</div>
      </div>
    {% empty %}
      <p class="text-gray-500 dark:text-gray-400 text-center text-lg font-playful">No blogs have been posted yet. 🐱</p>
    {% endfor %}
  </div>
{% endblock %}
