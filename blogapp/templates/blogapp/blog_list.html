{% extends 'base.html' %}
{% block content %}
  <h1 class="text-3xl font-bold mb-6 text-center text-gray-900 dark:text-white font-playful animate-fade-in">All Blogs 🐾</h1>
  <div class="grid gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
    {% for blog in object_list %}
      <div class="bg-gradient-to-r from-cat-purple to-cat-blue dark:from-soft-purple dark:to-indigo-800 rounded-lg shadow-lg p-6 hover:shadow-xl transition-all duration-700 ease-in-out animate-fade-in animate-bounce">
        <h2 class="text-xl font-semibold mb-2">
          <a href="{% url 'blogapp:blog_detail' blog.pk %}" class="text-cat-blue hover:text-blue-300 font-playful">{{ blog.title }}</a>
        </h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 font-playful">by {{ blog.author.username }} - {{ blog.created_at }}</p>
      </div>
    {% empty %}
      <p class="text-gray-500 dark:text-gray-400 text-center font-playful animate-fade-in">No blogs have been posted yet. 😿</p>
    {% endfor %}
  </div>
{% endblock %}
